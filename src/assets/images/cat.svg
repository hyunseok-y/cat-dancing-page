<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>
  
  <!-- Cat head -->
  <circle cx="100" cy="80" r="35" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>
  
  <!-- Cat ears -->
  <polygon points="75,55 85,35 95,55" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>
  <polygon points="105,55 115,35 125,55" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>
  
  <!-- Inner ears -->
  <polygon points="78,52 85,42 92,52" fill="#ffb6c1"/>
  <polygon points="108,52 115,42 122,52" fill="#ffb6c1"/>
  
  <!-- Cat eyes -->
  <ellipse cx="90" cy="75" rx="6" ry="8" fill="#000"/>
  <ellipse cx="110" cy="75" rx="6" ry="8" fill="#000"/>
  <ellipse cx="92" cy="73" rx="2" ry="3" fill="#fff"/>
  <ellipse cx="112" cy="73" rx="2" ry="3" fill="#fff"/>
  
  <!-- Cat nose -->
  <polygon points="100,85 95,90 105,90" fill="#ff1493"/>
  
  <!-- Cat mouth -->
  <path d="M 100 90 Q 95 95 90 90" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M 100 90 Q 105 95 110 90" stroke="#000" stroke-width="2" fill="none"/>
  
  <!-- Cat whiskers -->
  <line x1="70" y1="80" x2="85" y2="82" stroke="#000" stroke-width="1.5"/>
  <line x1="70" y1="85" x2="85" y2="85" stroke="#000" stroke-width="1.5"/>
  <line x1="115" y1="82" x2="130" y2="80" stroke="#000" stroke-width="1.5"/>
  <line x1="115" y1="85" x2="130" y2="85" stroke="#000" stroke-width="1.5"/>
  
  <!-- Cat legs -->
  <ellipse cx="80" cy="160" rx="8" ry="15" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>
  <ellipse cx="120" cy="160" rx="8" ry="15" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>
  
  <!-- Cat paws -->
  <circle cx="80" cy="175" r="6" fill="#ff6347"/>
  <circle cx="120" cy="175" r="6" fill="#ff6347"/>
  
  <!-- Cat tail -->
  <path d="M 145 130 Q 165 120 170 100 Q 175 80 165 70" stroke="#ff7f50" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Cat stripes on body -->
  <ellipse cx="100" cy="120" rx="35" ry="3" fill="#ff6347" opacity="0.6"/>
  <ellipse cx="100" cy="135" rx="30" ry="3" fill="#ff6347" opacity="0.6"/>
  <ellipse cx="100" cy="150" rx="25" ry="3" fill="#ff6347" opacity="0.6"/>
  
  <!-- Cat belly -->
  <ellipse cx="100" cy="140" rx="20" ry="15" fill="#ffb6c1" opacity="0.7"/>
</svg>